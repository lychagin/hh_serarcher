services:
  hh-search:
    build: .
    image: hh-search:latest
    # `unless-stopped` перезапускает контейнер на ЛЮБОМ коде возврата, включая
    # нулевой, — то есть остановить демон одним кодом здесь невозможно в
    # принципе, и заявленная спекой §9 остановка на устойчивом 403 так не
    # достигается: счётчик подряд идущих 403 обнуляется вместе с процессом.
    # Поэтому остановку обеспечивает не политика рестарта, а файл-маркер
    # /data/state/access-forbidden.stop: перезапущенный контейнер видит его и
    # завершается, не отправив к hh.ru ни одного запроса (Docker разводит
    # рестарты экспоненциально, healthcheck при этом красный). Политика
    # оставлена прежней сознательно: обычная авария обязана лечиться
    # перезапуском, и `on-failure` этого не изменил бы — он тоже
    # перезапускает на коде 1.
    restart: unless-stopped
    # uid контейнера обязан совпадать с владельцем ./data на хосте: bind-mount
    # подменяет каталог образа хостовым ВМЕСТЕ с владельцем, и chown внутри
    # Dockerfile до него не доезжает. Значения берутся из .env (см. README).
    user: "${HH_UID:-1000}:${HH_GID:-1000}"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/data
    environment:
      TZ: Europe/Moscow
    # Больше, чем стоит остановка с обработчиком (0.26 с), но достаточно, чтобы
    # прогон успел закрыть транзакцию, если SIGTERM пришёл в середине.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-m", "hh_search", "healthcheck"]
      interval: 15m
      timeout: 30s
      retries: 3
      start_period: 5m
