# ЗАМЕНИТЕ на свой адрес перед первым запуском: он уезжает в User-Agent и
# служит hh.ru способом с нами связаться (спека §3.5). Заглушка намеренно
# латинская: httpx кодирует заголовки в ascii, поэтому кириллица здесь роняет
# КАЖДЫЙ прогон UnicodeEncodeError'ом из глубины httpx — а в `serve` этот отказ
# ловится общим `except Exception`, и демон вечно крутит пустой цикл раз в
# четыре часа. Валидатор конфига такую заглушку пропускает: она валидный адрес.
contact_email: "your-email@example.com"
user_agent: "hh-search/0.1 (personal job search; {contact_email})"
schedule:
  interval_hours: 4
http:
  delay_between_requests_sec: 1.0
  timeout_sec: 20
  max_retries: 3
  respect_robots: true
enrich:
  max_attempts: 3
# Потолок объёма ОДНОГО прогона — предохранитель, а не оптимизация. Значения
# ниже равны умолчаниям и штатному режиму не мешают: сумма `pages` из
# queries.yaml далеко не заполняет listing_pages_per_run. Точное число здесь
# не повторяется — оно протухает от любой правки queries.yaml; оно живёт в
# §4.1 спеки, где его сторожит тест. Ручки нужны, когда листингов
# становится много: сумма `pages` по всем
# листингам сверяется с listing_pages_per_run ещё при загрузке конфига, и
# конфиг, у которого одни только паузы вежливости длиннее интервала между
# прогонами, отвергается на старте.
limits:
  listing_pages_per_run: 60   # сумма pages по всем листингам = число запросов шага 1
  enrich_per_run: 200         # прямой потолок запросов к страницам вакансий за прогон
  rows_per_batch: 500         # сколько строк одна выборка поднимает в память
  llm_per_run: 200            # прямой потолок вакансий, отдаваемых локальной модели
# Локальная Ollama (спека `2026-08-26-local-llm-design.md`). Общего флага
# `enabled` нет: выключение целиком выражается двумя `false`, и тогда клиент
# не строится вовсе. Два флага, а не один, потому что цена у них разная —
# `facts` стоит прогону около пяти минут, `semantic` около одной (замер §0.5).
#
# `base_url: auto` вычисляет адрес хоста из таблицы маршрутов при старте.
# Умолчание именно такое: адрес шлюза WSL2 меняется при каждой перезагрузке
# Windows, а записанный руками протухает МОЛЧА — прогон не падает, а
# деградирует на одни ключевые слова. Переменная HH_LLM_BASE_URL старше
# конфига: в контейнере хост зовут host.docker.internal.
llm:
  base_url: auto
  chat_model: llama3
  embed_model: bge-m3
  timeout_sec: 60
  semantic: true
  facts: true
sinks: [csv, markdown]
paths:
  state: /data/state/hh.db
  reports: /data/reports
  logs: /data/logs
